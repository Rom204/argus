name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Build eBPF programs
        run: |
          if [ -d "bpf" ]; then
            for f in bpf/*.bpf.c; do
              [ -e "$f" ] || continue
              clang -O2 -g -target bpf -I/usr/include/$(uname -m)-linux-gnu -c "$f" -o "${f%.c}.o"
            done
          fi

      - name: Go vet
        run: go vet ./...

      - name: Build Go binary
        run: go build ./...

      - name: Run Go tests
        run: go test ./...